<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>WANAREKSA Favicon</title>
  <!-- Dark Telemetry Disc -->
  <circle cx="128" cy="128" r="118" fill="#090D16" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.2" />
  <circle cx="128" cy="128" r="108" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4 6" stroke-opacity="0.3" />

  <!-- Cardinal Reticles -->
  <line x1="128" y1="6" x2="128" y2="18" stroke="#FF453A" stroke-width="3" stroke-linecap="round" />
  <line x1="128" y1="238" x2="128" y2="250" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" />
  <line x1="6" y1="128" x2="18" y2="128" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.4" stroke-linecap="round" />
  <line x1="238" y1="128" x2="250" y2="128" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.4" stroke-linecap="round" />

  <!-- Stratigraphic Peat Horizons -->
  <line x1="44" y1="116" x2="212" y2="116" stroke="#94A3B8" stroke-width="3" stroke-opacity="0.4" stroke-linecap="round" />
  <line x1="62" y1="148" x2="194" y2="148" stroke="#00E5FF" stroke-width="2.5" stroke-dasharray="6 4" stroke-linecap="round" />
  <line x1="84" y1="180" x2="172" y2="180" stroke="#64748B" stroke-width="2.5" stroke-opacity="0.3" stroke-linecap="round" />

  <!-- Dynamic 'W' Aerospace Wings -->
  <polyline points="56,76 96,164 128,104" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="200,76 160,164 128,104" fill="none" stroke="#FF453A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Thermal Focal Node -->
  <circle cx="128" cy="148" r="10" fill="#FF453A" fill-opacity="0.3" />
  <circle cx="128" cy="148" r="6.5" fill="#FF453A" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="128" cy="148" r="2.5" fill="#FFFFFF" />

  <!-- Orbital Zenith Sensor -->
  <polygon points="128,32 134,42 128,52 122,42" fill="#00E5FF" />
</svg>

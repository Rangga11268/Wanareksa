    <meta name="theme-color" content="#070b14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <title>Wanareksa — Earth Observation & Peatland Sentinel | NASA Space Apps Challenge 2026</title>
    <meta name="description" content="Wanareksa: Cross-sensor harmonization of MODIS and VIIRS satellite active fire hotspots for tropical peatland protection across Indonesia." />
    
    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://wanareksa.earth/" />
    <meta property="og:title" content="Wanareksa — Earth Observation & Peatland Sentinel" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wanareksa — Earth Observation & Peatland Sentinel" />
    <meta name="twitter:description" content="Planetary multi-sensor climatology and Indonesian tropical peatland intelligence suite for NASA Space Apps Challenge 2026." />
    <meta name="twitter:image" content="/terra_hero_satellite_earth.jpg" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://wanareksa.earth/" />
    <link rel="ard" type="application/json" href="/.well-known/ard.json" />

    <!-- Schema.org JSON-LD Structured Data for Awwwards & Semantic SEO -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebApplication",
            "@id": "https://wanareksa.earth/#webapp",
            "name": "Wanareksa",
            "applicationCategory": "ScienceApplication",
            "operatingSystem": "All modern browsers",
            "description": "Planetary Multi-Sensor Climatology & Indonesian Tropical Peatland Intelligence Suite developed for NASA Space Apps Challenge 2026.",
            "url": "https://wanareksa.earth/",
            "inLanguage": ["id", "en"],
            "license": "https://opensource.org/licenses/MIT",
            "creator": {
              "@type": "Organization",
              "name": "Wanareksa Science Team",
              "url": "https://wanareksa.earth/"
            }
          },
          {
            "@type": "Dataset",
            "@id": "https://wanareksa.earth/#dataset",
            "name": "Indonesian Peatland Multi-Decadal Satellite Fire Climatology (2000-2026)",
            "description": "Harmonized equal-area 5.5 km gridded satellite fire observation dataset combining NASA TERRA/AQUA MODIS and SUOMI-NPP/NOAA-20 VIIRS records.",
            "temporalCoverage": "2000-01-01/2026-12-31",
            "spatialCoverage": {
              "@type": "Place",
              "geo": {
                "@type": "GeoShape",
                "box": "-11.5 94.0 6.5 141.5"
              }
            },
            "variableMeasured": [
              "Fire Radiative Power (MW)",
              "Hotspot Cluster Density",
              "Peat Groundwater Table Depth (TMAG, cm)",
              "Equal-Area Grid Cluster Area (km2)"
            ]
          }
        ]
      }
    </script>
    <!-- Fonts (Non-render-blocking high performance load: Inter primary + JetBrains Mono technical) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
    </noscript>
    <!-- Theme Detection (Instant System & Preference Sync) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('wanareksa_theme');
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && systemDark)) {
            document.documentElement.classList.add('dark');
            if (document.body) document.body.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
            if (document.body) document.body.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-[#070b14] text-slate-900 dark:text-slate-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

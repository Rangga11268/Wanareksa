<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wanareksa System Architecture — NASA Space Apps 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #0b0f17;
      --paper-card: #111827;
      --paper-card-border: #1f293d;
      --ink: #f3f4f6;
      --ink-muted: #94a3b8;
      --ink-soft: #64748b;
      --accent: #f97316;
      --accent-tint: rgba(249, 115, 22, 0.12);
      --accent-border: #ea580c;
      --link: #38bdf8;
      --emerald: #10b981;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--paper);
      color: var(--ink);
      font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 48px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    header {
      width: 100%;
      max-width: 1100px;
      margin-bottom: 32px;
      border-bottom: 1px solid var(--paper-card-border);
      padding-bottom: 24px;
    }
    .eyebrow {
      font-family: "Geist Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .eyebrow::before {
      content: "";
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
    }
    h1 {
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400;
      font-size: 40px;
      line-height: 1.15;
      color: #ffffff;
      letter-spacing: -0.01em;
    }
    .subtitle {
      font-size: 15px;
      color: var(--ink-muted);
      margin-top: 8px;
      max-width: 760px;
      line-height: 1.5;
    }
    .diagram-container {
      width: 100%;
      max-width: 1100px;
      background: #070a10;
      border: 1px solid var(--paper-card-border);
      border-radius: 8px;
      padding: 32px 24px;
      overflow-x: auto;
    }
    svg {
      display: block;
      margin: 0 auto;
      max-width: 100%;
      height: auto;
    }
    .legend-strip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--paper-card-border);
      font-family: "Geist Mono", monospace;
      font-size: 11px;
      color: var(--ink-muted);
      flex-wrap: wrap;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <header>
    <div class="eyebrow">NASA Space Apps Challenge 2026 // Planetary Climatology Suite</div>
    <h1>Wanareksa End-to-End System Architecture</h1>
    <p class="subtitle">
      Multi-sensor satellite observation harmonization, biophysical peat hydrology coupling, and frontline rapid-response dispatch pipeline.
    </p>
  </header>

  <div class="diagram-container">
    <svg 
      xmlns="http://www.w3.org/2000/svg" 
      viewBox="0 0 1020 540" 
      width="1020" 
      height="540" 
      role="img" 
      aria-labelledby="wanareksa-arch-title wanareksa-arch-desc"
    >
      <title id="wanareksa-arch-title">Wanareksa System Architecture Diagram</title>
      <desc id="wanareksa-arch-desc">
        Architectural pipeline detailing ingestion from NASA FIRMS and GIBS, spatial binning, Stefan-Boltzmann cross-sensor calibration, BRGM groundwater hydrology coupling, 26-year baseline anomaly detection, and frontline dispatch actions.
      </desc>

      <defs>
        <!-- Arrowhead Markers -->
        <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
        </marker>
        <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f97316"/>
        </marker>
        <marker id="arrow-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
        </marker>
      </defs>

      <!-- Zones / Background Containers -->
      <g id="zones">
        <!-- Ingestion Zone -->
        <rect x="20" y="20" width="220" height="420" rx="8" fill="#0d131f" stroke="#1e293b" stroke-width="1"/>
        <text x="36" y="44" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1">STAGE 1: EARTH INGESTION</text>

        <!-- Harmonization Core Zone -->
        <rect x="270" y="20" width="460" height="420" rx="8" fill="#0d131f" stroke="#1e293b" stroke-width="1"/>
        <text x="286" y="44" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#f97316" letter-spacing="1">STAGE 2: HARMONIZATION &amp; PHYSICS CORE</text>

        <!-- Dispatch & Output Zone -->
        <rect x="760" y="20" width="240" height="420" rx="8" fill="#0d131f" stroke="#1e293b" stroke-width="1"/>
        <text x="776" y="44" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#38bdf8" letter-spacing="1">STAGE 3: DECISION &amp; DISPATCH</text>
      </g>

      <!-- Connectors (drawn before nodes so they sit cleanly behind) -->
      <g id="connectors">
        <!-- Node 1 -> Node 3 (MODIS/VIIRS -> 5.5km Binning) -->
        <path d="M 210 120 L 300 120" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow-muted)"/>
        <rect x="230" y="112" width="50" height="16" fill="#070a10"/>
        <text x="255" y="124" font-family="'Geist Mono', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">HOTSPOTS</text>

        <!-- Node 2 -> Node 5 (BRGM Hydrology -> Peat Coupling) -->
        <path d="M 210 330 L 300 330" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow-muted)"/>
        <rect x="228" y="322" width="54" height="16" fill="#070a10"/>
        <text x="255" y="334" font-family="'Geist Mono', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">TMAG DATA</text>

        <!-- Node 3 -> Node 4 (5.5km Binning -> Stefan-Boltzmann FRP Focal) -->
        <path d="M 480 120 L 520 120" stroke="#f97316" stroke-width="2" fill="none" marker-end="url(#arrow-accent)"/>
        <rect x="484" y="112" width="32" height="16" fill="#070a10"/>
        <text x="500" y="124" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#f97316" text-anchor="middle">CLUST</text>

        <!-- Node 4 -> Node 6 (Stefan-Boltzmann FRP -> 26y Climatology) -->
        <path d="M 610 170 L 610 240 L 480 240" stroke="#f97316" stroke-width="1.5" fill="none" marker-end="url(#arrow-accent)"/>
        <rect x="526" y="232" width="68" height="16" fill="#070a10"/>
        <text x="560" y="244" font-family="'Geist Mono', monospace" font-size="9" fill="#f97316" text-anchor="middle">NORM FRP (MW)</text>

        <!-- Node 5 -> Node 6 (Peat Hydrology Coupling -> 26y Climatology) -->
        <path d="M 390 280 L 390 260" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow-muted)"/>

        <!-- Node 4 -> Node 7 (FRP Focal -> Incident Dispatch) -->
        <path d="M 700 120 L 780 120" stroke="#38bdf8" stroke-width="1.5" fill="none" marker-end="url(#arrow-link)"/>
        <rect x="716" y="112" width="50" height="16" fill="#070a10"/>
        <text x="741" y="124" font-family="'Geist Mono', monospace" font-size="9" fill="#38bdf8" text-anchor="middle">REALTIME</text>

        <!-- Node 6 -> Node 8 (Climatology -> Executive SitRep & GIS) -->
        <path d="M 480 230 L 740 230 L 740 330 L 780 330" stroke="#38bdf8" stroke-width="1.5" fill="none" marker-end="url(#arrow-link)"/>
        <rect x="715" y="272" width="52" height="16" fill="#070a10"/>
        <text x="741" y="284" font-family="'Geist Mono', monospace" font-size="9" fill="#38bdf8" text-anchor="middle">ANOMALIES</text>
      </g>

      <!-- Nodes -->
      <g id="nodes">
        <!-- Node 1: NASA Satellite Feeds -->
        <rect x="40" y="70" width="170" height="100" rx="6" fill="#111827" stroke="#334155" stroke-width="1"/>
        <rect x="48" y="78" width="56" height="14" rx="2" fill="#1e293b"/>
        <text x="52" y="88" font-family="'Geist Mono', monospace" font-size="8" fill="#94a3b8">DATA FEED</text>
        <text x="48" y="112" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#f8fafc">NASA FIRMS &amp; GIBS</text>
        <text x="48" y="132" font-family="'Geist Mono', monospace" font-size="10" fill="#64748b">MODIS (1.0 km) Terra/Aqua</text>
        <text x="48" y="148" font-family="'Geist Mono', monospace" font-size="10" fill="#64748b">VIIRS (375 m) S-NPP/N20</text>

        <!-- Node 2: BRGM In-Situ Hydrology -->
        <rect x="40" y="280" width="170" height="100" rx="6" fill="#111827" stroke="#334155" stroke-width="1"/>
        <rect x="48" y="288" width="68" height="14" rx="2" fill="#1e293b"/>
        <text x="52" y="298" font-family="'Geist Mono', monospace" font-size="8" fill="#10b981">IN-SITU SENSORS</text>
        <text x="48" y="322" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#f8fafc">BRGM Hydrology</text>
        <text x="48" y="342" font-family="'Geist Mono', monospace" font-size="10" fill="#64748b">TMAG Telemetry Station</text>
        <text x="48" y="358" font-family="'Geist Mono', monospace" font-size="10" fill="#64748b">PP 71/2014 (-40cm Limit)</text>

        <!-- Node 3: 5.5 km Spatial Binning -->
        <rect x="300" y="70" width="180" height="100" rx="6" fill="#111827" stroke="#334155" stroke-width="1"/>
        <rect x="308" y="78" width="84" height="14" rx="2" fill="#1e293b"/>
        <text x="312" y="88" font-family="'Geist Mono', monospace" font-size="8" fill="#94a3b8">SPATIAL HARMONIZER</text>
        <text x="308" y="112" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#f8fafc">5.5 km Equal-Area Grid</text>
        <text x="308" y="132" font-family="'Geist Mono', monospace" font-size="10" fill="#64748b">Sub-pixel pass aggregator</text>
        <text x="308" y="148" font-family="'Geist Mono', monospace" font-size="10" fill="#64748b">Area ≈ 26.2 km² cells</text>

        <!-- Node 4: Stefan-Boltzmann FRP Calibration (FOCAL ACCENT) -->
        <rect x="520" y="70" width="180" height="100" rx="6" fill="rgba(249, 115, 22, 0.08)" stroke="#ea580c" stroke-width="1.5"/>
        <rect x="528" y="78" width="80" height="14" rx="2" fill="rgba(249, 115, 22, 0.25)"/>
        <text x="532" y="88" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" fill="#f97316">CALIBRATION ENGINE</text>
        <text x="528" y="112" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#ffedd5">Stefan-Boltzmann FRP</text>
        <text x="528" y="132" font-family="'Geist Mono', monospace" font-size="10" fill="#fed7aa">FRP_cal = 1.0·MOD + 0.88·VII</text>
        <text x="528" y="148" font-family="'Geist Mono', monospace" font-size="10" fill="#fed7aa">Zero-bias energy flux</text>

        <!-- Node 5: Peatland Hydrology Coupling -->
        <rect x="300" y="280" width="180" height="100" rx="6" fill="#111827" stroke="#334155" stroke-width="1"/>
        <rect x="308" y="288" width="82" height="14" rx="2" fill="#1e293b"/>
        <text x="312" y="298" font-family="'Geist Mono', monospace" font-size="8" fill="#10b981">BIOPHYSICS ENGINE</text>
        <text x="308" y="322" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Peat Depth Coupling</text>
        <text x="308" y="342" font-family="'Geist Mono', monospace" font-size="10" fill="#64748b">Water Table Depth (&lt;-40cm)</text>
        <text x="308" y="358" font-family="'Geist Mono', monospace" font-size="10" fill="#64748b">Smoldering burn risk index</text>

        <!-- Node 6: 26-Year Climatology Matrix -->
        <rect x="300" y="190" width="180" height="70" rx="6" fill="#111827" stroke="#334155" stroke-width="1"/>
        <rect x="308" y="196" width="76" height="14" rx="2" fill="#1e293b"/>
        <text x="312" y="206" font-family="'Geist Mono', monospace" font-size="8" fill="#94a3b8">STATISTICAL BASELINE</text>
        <text x="308" y="228" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">26-Year Climatology</text>
        <text x="308" y="246" font-family="'Geist Mono', monospace" font-size="10" fill="#64748b">Weekly Z-score anomaly (&gt;2σ)</text>

        <!-- Node 7: Frontline Dispatch Pipeline -->
        <rect x="780" y="70" width="200" height="100" rx="6" fill="#111827" stroke="#38bdf8" stroke-width="1.2"/>
        <rect x="788" y="78" width="78" height="14" rx="2" fill="rgba(56, 189, 248, 0.15)"/>
        <text x="792" y="88" font-family="'Geist Mono', monospace" font-size="8" fill="#38bdf8">FRONTLINE ACTION</text>
        <text x="788" y="112" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#f0f9ff">Manggala Agni Dispatch</text>
        <text x="788" y="132" font-family="'Geist Mono', monospace" font-size="10" fill="#94a3b8">Automated WhatsApp SitRep</text>
        <text x="788" y="148" font-family="'Geist Mono', monospace" font-size="10" fill="#94a3b8">Regency coordinate brief</text>

        <!-- Node 8: Executive Dossier & GIS -->
        <rect x="780" y="280" width="200" height="100" rx="6" fill="#111827" stroke="#334155" stroke-width="1"/>
        <rect x="788" y="288" width="76" height="14" rx="2" fill="#1e293b"/>
        <text x="792" y="298" font-family="'Geist Mono', monospace" font-size="8" fill="#94a3b8">OPEN DATA OUTPUT</text>
        <text x="788" y="322" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#f8fafc">SitRep Dossier &amp; GIS</text>
        <text x="788" y="342" font-family="'Geist Mono', monospace" font-size="10" fill="#64748b">High-res client A4 PDF</text>
        <text x="788" y="358" font-family="'Geist Mono', monospace" font-size="10" fill="#64748b">RFC 7946 GeoJSON export</text>
      </g>

      <!-- Bottom Horizontal Legend Strip -->
      <g id="legend" transform="translate(40, 480)">
        <rect x="0" y="0" width="940" height="40" rx="6" fill="#0d131f" stroke="#1e293b" stroke-width="1"/>
        
        <!-- Legend Items -->
        <g transform="translate(30, 16)">
          <rect x="0" y="0" width="10" height="10" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1"/>
          <text x="16" y="9" font-family="'Geist Mono', monospace" font-size="10" fill="#94a3b8">Standard Pipeline Node</text>
        </g>
        <g transform="translate(250, 16)">
          <rect x="0" y="0" width="10" height="10" rx="2" fill="rgba(249, 115, 22, 0.2)" stroke="#ea580c" stroke-width="1"/>
          <text x="16" y="9" font-family="'Geist Mono', monospace" font-size="10" fill="#f97316">Focal Calibration Core (≤2)</text>
        </g>
        <g transform="translate(510, 16)">
          <line x1="0" y1="5" x2="20" y2="5" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,2"/>
          <text x="28" y="9" font-family="'Geist Mono', monospace" font-size="10" fill="#38bdf8">Dispatch / Output Flow</text>
        </g>
        <g transform="translate(730, 16)">
          <text x="0" y="9" font-family="'Geist Mono', monospace" font-size="10" fill="#64748b">Orthogonal 4px Grid Architecture</text>
        </g>
      </g>
    </svg>
  </div>

</body>
</html>
